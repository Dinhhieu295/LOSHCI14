services:
  - type: web
    name: loshci14-demo-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_TTL_DAYS
        value: 30
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: loshci14-demo-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: loshci14-demo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: loshci14-demo-api
          envVarKey: RENDER_EXTERNAL_URL
