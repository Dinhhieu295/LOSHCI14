services:
  - type: web
    name: loshci14-ai-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: ASSISTANT_SETTINGS_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: SESSION_TTL_DAYS
        value: 30
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: loshci14-ai-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: loshci14-ai-web
    runtime: static
    buildCommand: npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    buildFilter:
      paths:
        - frontend/**
        - backend/src/application/assistant-math.ts
        - render.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: loshci14-ai-api
          envVarKey: RENDER_EXTERNAL_URL
